# Policy-gate fixture: violates exactly P10 (a fork PR's head repository name
# mapped raw into env:; only the whole-expression comparison with
# github.repository is allowed, Story 04.0 Task 02).
name: fixture
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
env:
  CI_PR_SAME_REPO: ${{ github.event.pull_request.head.repo.full_name }}
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Lint
        run: python3 scripts/ci/lint.py
        timeout-minutes: 5
