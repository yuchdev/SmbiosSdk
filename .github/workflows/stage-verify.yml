# Reusable `verify` stage - PLACEHOLDER (milestone 0012 Story 04.0 Task 02;
# completed by Task 04; ADR 0005 D1/D6/D8).
#
# Task 02 adds this file only so that the publish caller in ci.yml can carry
# `needs: verify` (ADR 0005 D6, policy P12) in the form Task 04 completes. It
# fails closed in three independent ways until Task 04 lands:
#   - plan.py reports `verify` as "not run: stage not defined", so its leg list
#     is [] and ci.yml skips this job (and with it the publish caller);
#   - if it ever ran, `stage.py verify` exits 2 ("stage verify is not defined
#     yet");
#   - it never sets verified_manifest_sha256, and `stage.py publish` refuses
#     to publish without it.
# Task 04 replaces the step with the clean-room checks of
# docs/roadmap/0012-package-manager-distribution/04.0-release-and-publish-automation/04-post-publish-verification.md
# and sets verified_manifest_sha256 only after every leg passed.
#
# The shape it already follows (threat model 2026-11-18 RP-4, constraint 4):
# `dist` is downloaded by the package stage's artifact ID, never by name, and
# the manifest digest arrives as a job output, not inside the artifact. No
# credential, no cache (P15).
name: stage-verify

on:
  workflow_call:
    inputs:
      legs:
        description: JSON list of packaging legs to verify (from the plan job)
        type: string
        required: true
      manifest_sha256:
        description: sha256 of dist/manifest.json (the package stage's manifest job output)
        type: string
        required: true
      dist_artifact_id:
        description: Artifact ID of `dist` (the package stage's manifest job output)
        type: string
        required: true
    outputs:
      verified_manifest_sha256:
        description: The manifest digest every verify leg passed (never set until Task 04)
        value: ${{ jobs.verify.outputs.verified_manifest_sha256 }}

permissions:
  contents: read

env:
  CI_PLATFORM: github
  CI_REPORTER: github
  CI_RUN_ID: ${{ github.run_id }}
  CI_RUN_ATTEMPT: ${{ github.run_attempt }}
  CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  CI_EVENT: ${{ github.ref_type == 'tag' && 'tag' || github.event_name == 'pull_request' && 'pr' || github.event_name == 'workflow_dispatch' && 'manual' || github.event_name }}
  CI_REF: ${{ github.ref }}
  CI_REF_NAME: ${{ github.ref_name }}
  CI_COMMIT: ${{ github.sha }}
  CI_WORKSPACE: ${{ github.workspace }}

jobs:
  verify:
    name: verify (${{ matrix.leg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(inputs.legs) }}
        manifest_sha256: ['${{ inputs.manifest_sha256 }}']
    outputs:
      verified_manifest_sha256: ${{ steps.verify.outputs.verified_manifest_sha256 }}
    env:
      CI_JOB: verify
      CI_LEG: ${{ matrix.leg }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false

      - name: Download dist
        id: download-dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          artifact-ids: ${{ inputs.dist_artifact_id }}
          path: ${{ runner.temp }}/artifacts/dist
          merge-multiple: true

      # Exits 2 until Task 04 defines the stage (fail closed).
      - name: Verify
        id: verify
        run: python3 scripts/ci/stage.py verify
        timeout-minutes: 5
        env:
          CI_TEMP_DIR: ${{ runner.temp }}
          CI_MANIFEST_SHA256: ${{ matrix.manifest_sha256 }}
