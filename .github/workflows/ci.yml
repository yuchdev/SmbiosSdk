# Entry workflow of the rebuilt CI (milestone 0014, Story 03.0 Task 01;
# ADR 0005 D8). It holds the triggers and the job order only; every job
# calls a reusable stage workflow, whose every `run:` step is one
# `python3 scripts/ci/stage.py <stage> ...` line (plan SC1, policy P7).
# Runs side by side with the old ci.yml until the Story 03.0 Task 04
# cutover renames this file to ci.yml.
#
# Triggers (Story 04.0 Task 02, plan E7): push to every branch except
# probe/** (Story 04.0 Task 03), pull requests to master, v* tags (a release
# is this pipeline on a tag, ADR 0005 D7; the legacy -DGIT_TAG tags never
# match, P12) and a nightly schedule. No workflow_dispatch (maintainer
# ruling). No paths:/paths-ignore: filters: a workflow skipped by
# path never reports (plan Q5), so docs-only runs are classified inside the
# run by the `plan` job and the skipped legs are reported.
#
# Tiering: the `plan` job (scripts/ci/plan.py through `stage.py plan`)
# classifies the changes (docs or full) and applies the tier table of
# docs/dev/ci.md to scripts/ci/legs.json "tiers": docs-only changes run lint
# only; a push to a branch other than master runs lint + the three Linux legs;
# a same-repo PR runs only the legs that push tier did not run (its push run
# already reports the Linux legs on the same commit); a fork PR, a master
# push, a v* tag and the nightly run the full matrix. Its JSON outputs feed
# each leg job's `legs` input (fromJSON in the stage workflow); a job whose
# list is empty is skipped with `if:` (an empty matrix is an error). `lint`
# always runs.
#
# Concurrency: one group per PR (or per ref for pushes, tags and the
# schedule); a newer run cancels a superseded one, except on master and on
# tags, which are never cancelled.
#
# Environment: the neutral CI_* mapping (ADR 0005) is in each stage
# workflow, because a caller's `env:` does not reach a called workflow.
name: CI

on:
  push:
    branches-ignore: ['probe/**']
    tags: ['v*']
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Story 04.0 Task 02 (plan E7): classify_changes.py + the tier table. Its
  # outputs are single-line JSON written only through Reporter.set_output()
  # (CR-6/CR-8); every input is re-validated by plan.py (exit 2 on anything
  # unknown). Full history (fetch-depth 0 also fetches every branch, so
  # refs/remotes/origin/master exists): a push to a branch other than master
  # is diffed against its merge base with origin/master, a master or tag push
  # against the event's `before`, a PR against its base. A base that cannot be
  # resolved (classify_changes.py tries one credential-less fetch of master)
  # is classified `full`.
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      sanitizers: ${{ steps.plan.outputs.sanitizers }}
      gui: ${{ steps.plan.outputs.gui }}
      package: ${{ steps.plan.outputs.package }}
      verify: ${{ steps.plan.outputs.verify }}
      publish: ${{ steps.plan.outputs.publish }}
      plan: ${{ steps.plan.outputs.plan }}
    env:
      CI_PLATFORM: github
      CI_REPORTER: github
      CI_RUN_ID: ${{ github.run_id }}
      CI_RUN_ATTEMPT: ${{ github.run_attempt }}
      CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CI_EVENT: ${{ github.ref_type == 'tag' && 'tag' || github.event_name == 'pull_request' && 'pr' || github.event_name == 'workflow_dispatch' && 'manual' || github.event_name }}
      CI_REF: ${{ github.ref }}
      CI_REF_NAME: ${{ github.ref_name }}
      CI_COMMIT: ${{ github.sha }}
      CI_BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
      CI_PR_SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      CI_WORKSPACE: ${{ github.workspace }}
      CI_JOB: plan
      CI_LEG: linux
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan
        id: plan
        run: python3 scripts/ci/stage.py plan
        timeout-minutes: 1
        env:
          CI_TEMP_DIR: ${{ runner.temp }}

  lint:
    uses: ./.github/workflows/stage-lint.yml

  build:
    needs: [lint, plan]
    if: needs.plan.outputs.build != '[]'
    uses: ./.github/workflows/stage-build.yml
    with:
      legs: ${{ needs.plan.outputs.build }}

  # Story 03.0 Task 02: inventory C12-C14 (ASan + fatal UBSan, Linux/macOS).
  sanitizers:
    needs: [lint, plan]
    if: needs.plan.outputs.sanitizers != '[]'
    uses: ./.github/workflows/stage-sanitizers.yml
    with:
      legs: ${{ needs.plan.outputs.sanitizers }}

  # Story 03.0 Task 03: inventory C15-C20 (GUI build; the merge-blocking
  # R-7 hook-string and R-8 local-tier-absent guards).
  gui:
    needs: [lint, plan]
    if: needs.plan.outputs.gui != '[]'
    uses: ./.github/workflows/stage-gui.yml
    with:
      legs: ${{ needs.plan.outputs.gui }}

  # Milestone 0012 Story 03.0 Task 01 (ADR 0005 D1/D4/D7): the package stage.
  # Runs when the plan schedules it (every full-classified event but a branch
  # push), after the build job built, tested and installed the packaging legs
  # (tiers.full only). Each leg's install digest and hand-off artifact ID are
  # build-job outputs (CR-8), passed as one JSON object per leg; the stage
  # downloads by ID and refuses a tree whose digest differs. It never builds.
  package:
    needs: [plan, build]
    if: needs.plan.outputs.package != '[]'
    uses: ./.github/workflows/stage-package.yml
    with:
      legs: ${{ format('[{{"leg":"linux-x64","install_sha256":{0},"artifact_id":"{1}","binary_cache":{6}}},{{"leg":"windows-x64","install_sha256":{2},"artifact_id":"{3}","binary_cache":{7}}},{{"leg":"macos-arm64","install_sha256":{4},"artifact_id":"{5}","binary_cache":{8}}}]', needs.build.outputs.install_sha256_linux_x64, needs.build.outputs.install_artifact_linux_x64, needs.build.outputs.install_sha256_windows_x64, needs.build.outputs.install_artifact_windows_x64, needs.build.outputs.install_sha256_macos_arm64, needs.build.outputs.install_artifact_macos_arm64, needs.build.outputs.binary_cache_linux_x64, needs.build.outputs.binary_cache_windows_x64, needs.build.outputs.binary_cache_macos_arm64) }}

  # Milestone 0012 Story 04.0 (ADR 0005 D1/D6/D7): the verify stage. Its
  # logic is Task 04; until then `stage.py verify` exits 2 and the plan's
  # `verify` list is always [] (stage not defined), so this job is skipped.
  # It downloads `dist` by artifact ID and is given the package stage's
  # out-of-band manifest digest (threat model 2026-11-18 RP-4, constraint 4).
  # Task 04 completes it, including the `verified_manifest_sha256` output
  # the publish stage requires.
  verify:
    needs: [plan, package]
    if: needs.plan.outputs.verify != '[]'
    uses: ./.github/workflows/stage-verify.yml
    with:
      legs: ${{ needs.plan.outputs.verify }}
      manifest_sha256: ${{ fromJSON(needs.package.outputs.manifest_sha256) }}
      dist_artifact_id: ${{ needs.package.outputs.dist_artifact_id }}

  # Milestone 0012 Story 04.0 Tasks 02-03 (ADR 0005 D6/D9): the release tier of
  # the publish stage, the GitHub Release (release-draft, then release-promote)
  # and, on a final release tag, the registry branch (registry-prepare, then
  # registry-pr, which creates registry/v<version>; a human opens the PR).
  # Reached only from a v* tag push (P12 tier clause), only after the same
  # run's verify passed (needs: verify, and the implicit success() of a job
  # that names no status function), and only when the plan has publish rows -
  # which it never has while verify is not defined (plan.py; fail closed).
  # Inputs are job outputs, never files inside an artifact (RP-4): the
  # manifest digest and dist artifact ID from the package stage, each leg's
  # binary_cache from the build job (cold-build cross-check, CR-2), and the
  # manifest digest verify passed (empty until Task 04: publish refuses).
  publish-release:
    needs: [plan, build, package, verify]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.plan.outputs.publish != '[]'
    # permissions: stage-publish.yml's release-draft and release-promote create, upload to and promote the GitHub Release, and registry-pr creates the registry/v<version> branch; a called workflow's jobs cannot exceed this caller's grant (ADR 0005 D6).
    permissions:
      contents: write
    uses: ./.github/workflows/stage-publish.yml
    with:
      manifest_sha256: ${{ fromJSON(needs.package.outputs.manifest_sha256) }}
      dist_artifact_id: ${{ needs.package.outputs.dist_artifact_id }}
      binary_cache: ${{ format('{{"linux-x64":{0},"windows-x64":{1},"macos-arm64":{2}}}', needs.build.outputs.binary_cache_linux_x64, needs.build.outputs.binary_cache_windows_x64, needs.build.outputs.binary_cache_macos_arm64) }}
      verified_manifest_sha256: ${{ needs.verify.outputs.verified_manifest_sha256 }}
      # Story 04.0 Task 03: the registry jobs run only when the plan has their
      # rows, i.e. on a final v<X.Y.Z> tag, never a pre-release (constraint 8).
      registry: ${{ contains(needs.plan.outputs.publish, '"registry-pr"') }}

  # Story 04.0 Task 01 (plan E9): one run-level table of at most 40 lines
  # from the summary-<job>-<leg> artifacts every job uploads, and, when a
  # leg failed or has no record, the single run-level error annotation.
  # Legs and stages come from the plan job's `plan` output (CI_PLAN,
  # re-validated by plan.parse_plan): a leg the plan does not run shows
  # `not run: tier` or `not run: covered by push run`, a missing artifact of
  # a planned leg `no record` (never PASS); the milestone 0012 stages show
  # `not run: stage not defined`, `not run: tier`, or for a scheduled stage
  # (package) `run: result in its own jobs` (its jobs publish no summary yet).
  report:
    name: report
    needs: [plan, lint, build, sanitizers, gui]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CI_PLATFORM: github
      CI_REPORTER: github
      CI_RUN_ID: ${{ github.run_id }}
      CI_RUN_ATTEMPT: ${{ github.run_attempt }}
      CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CI_EVENT: ${{ github.ref_type == 'tag' && 'tag' || github.event_name == 'pull_request' && 'pr' || github.event_name == 'workflow_dispatch' && 'manual' || github.event_name }}
      CI_REF: ${{ github.ref }}
      CI_REF_NAME: ${{ github.ref_name }}
      CI_COMMIT: ${{ github.sha }}
      CI_WORKSPACE: ${{ github.workspace }}
      CI_PLAN: ${{ needs.plan.outputs.plan }}
      CI_JOB: report
      CI_LEG: linux
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false

      # Every summary-* artifact of this run into one directory (each file
      # is already named summary-<job>-<leg>.json).
      - name: Download job summaries
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          pattern: summary-*
          path: ${{ runner.temp }}/summaries
          merge-multiple: true

      - name: Run report
        id: report
        run: python3 scripts/ci/stage.py report
        timeout-minutes: 2
        env:
          CI_TEMP_DIR: ${{ runner.temp }}
