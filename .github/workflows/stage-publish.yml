# Reusable `publish` stage (milestone 0012 Story 04.0 Tasks 02-05; ADR 0005 D6,
# D8, D9). Called by ci.yml's publish-release (v* tag) and publish-staging
# (push to master) jobs; every job here is guarded to exactly one of the two.
#
# ADR 0005 D9 (Task 05): one matrix job per tier and permission class,
# publish-<tier>-<class>, runs every scheduled single-phase destination of
# that class (the plan job's publish_<class> output, passed in as an input,
# one matrix row per destination; stage.py reads the row as CI_DESTINATION and
# refuses a destination whose tier and class are not the job's). Adding a
# destination to a class that has such a job needs no edit here, as long as
# its credentials are among the CI_PUBLISH_* names the job's publish step
# already maps (policy P12 checks it). A new class or tier is one reviewed
# change here plus publish_jobs.json:
#
#   publish-release-repo-write: contents: write, environment release, v* tag
#     only. Empty today: github-release and vcpkg-registry are phased (D6) and
#     keep the jobs below.
#   publish-staging-oidc: id-token: write, environment staging, push to
#     master only, after the same run's verify (the verify gate). s3-staging
#     (ships enabled: false; enabling it needs setting S-9 read back first).
#     The OIDC token is requested by stage.py itself; only the staging
#     environment's CI_PUBLISH_S3_* secrets are mapped, in the step's env:.
#
# The phased release-tier destinations keep the D6 sequence. The GitHub
# Release: two jobs, both permission class repo-write, both in the `release`
# environment, then an unprivileged post-publish check (Task 04):
#
#   release-draft:   stage.py publish --destination github-release --only draft
#     creates ONE draft release (target_commitish = the run's commit), uploads
#     exactly the manifest's archives, their .sha256 files and manifest.json,
#     then re-reads the draft's assets (names, sizes, downloaded sha256).
#   release-promote: stage.py publish --destination github-release --only promote
#     re-reads the same draft's assets immediately before promoting it, then
#     publishes it (RP-6). Only release-draft creates a release (no upload
#     race, review M2).
#
# Threat model docs/security/2026-11-18-release-and-publish-automation.md,
# standing constraints for implementers, as this file applies them:
# 1. No toolchain in a credentialed job: each job is exactly checkout
#    (persist-credentials: false), download-artifact by artifact ID, and one
#    `stage.py publish --destination` step. Nothing compiles or extracts here.
# 2. The credential lives in one place: the env: of that one step, mapped to
#    CI_PUBLISH_TOKEN (the name the registry entry lists). Never at job or
#    workflow level, never in argv; stage.py removes it from its environment
#    before anything else runs and starts no child process.
# 4. `dist` is downloaded by the package stage's artifact ID, and stage.py
#    checks sha256(manifest.json) against the package stage's manifest_sha256
#    output before it parses the manifest.
# 5. stage.py dereferences the remote tag and checks master ancestry before
#    every write (one release, one commit).
# 6. The manifest's binary_cache must be `none` for every leg and equal the
#    build job's binary_cache_<leg> outputs (CR-2).
# 7. Create-only: an existing published release or another run's draft is a
#    hard failure; the only exception is this run's own marked draft.
# Publish also requires verified_manifest_sha256 (the same run's verify
# result, set by stage-verify.yml's verify-gate only when every packaging leg
# verified this manifest) to equal manifest_sha256; empty or different, it
# refuses. The github-release registry entry also ships `enabled: false`
# until settings S-1..S-8 are read back (constraint 12).
#
#   post-publish:    stage.py publish --destination github-release --only post-publish
#     (Task 04; threat model constraint 11, RP-7) contents: read, NO
#     environment, NO credential, not in publish_jobs.json. Downloads the
#     promoted release's assets anonymously from their public URLs (redirects
#     only to *.githubusercontent.com over HTTPS, each body cut off at its
#     manifest size), requires the exact asset name set, and compares them
#     with this run's anchored manifest - never with the release's own
#     manifest.json alone. A failure names the release; it is not a rollback.
#
# The registry update (Task 03; threat model RP-2, RP-9, constraints 1, 5, 8-10),
# final release tags only (`registry` input: plan.py gives a pre-release tag
# no registry rows):
#
#   registry-prepare: stage.py publish --destination vcpkg-registry --only prepare
#     contents: read, NO environment, NO credential, not in publish_jobs.json.
#     The only job that runs git, vcpkg and a compiler: fetches master, sets the
#     port REF to manifest.commit, runs vcpkg x-add-version (never overwriting)
#     and the registry consumer test, then uploads exactly three files and
#     exports their sha256, the base commit and the git-tree as job outputs.
#     No cache (P15), so vcpkg builds cold.
#   registry-pr: stage.py publish --destination vcpkg-registry --only branch
#     repo-write, contents: write only (no pull-requests: write, RP-9). REST
#     only: re-reads the base through the Git Data API, accepts nothing but the
#     one allowed change, then creates the NEW branch registry/v<version>
#     (create-only). It never opens, approves or merges a PR and never writes
#     master: the maintainer opens the PR, which then gets normal CI.
#
# Inputs reach the step only through a one-entry matrix, because policy P10
# lets env: read matrix.* but not inputs.* (the same pattern as
# stage-package.yml). Every value is re-validated by stage.py.
name: stage-publish

on:
  workflow_call:
    inputs:
      manifest_sha256:
        description: sha256 of dist/manifest.json (the package stage's manifest job output)
        type: string
        required: true
      dist_artifact_id:
        description: Artifact ID of `dist` (the package stage's manifest job output)
        type: string
        required: true
      binary_cache:
        description: JSON object leg -> none|restored from the build job's binary_cache_<leg> outputs
        type: string
        required: true
      verified_manifest_sha256:
        description: The manifest digest every leg of the same run's verify stage passed (stage-verify.yml verify-gate; empty means refuse)
        type: string
        required: false
        default: ''
      registry:
        description: Whether the plan has registry rows (a final v<X.Y.Z> tag; never a pre-release, constraint 8)
        type: boolean
        required: false
        default: false
      publish_repo_write:
        description: JSON list of the repo-write class matrix's destinations (plan output publish_repo_write; ADR 0005 D9)
        type: string
        required: false
        default: '[]'
      publish_oidc:
        description: JSON list of the oidc class matrix's destinations (plan output publish_oidc; ADR 0005 D9)
        type: string
        required: false
        default: '[]'

permissions:
  contents: read

# Neutral names (ADR 0005 "Neutral environment names"). runner.temp is only
# available at step level, so CI_TEMP_DIR is set on the stage step.
env:
  CI_PLATFORM: github
  CI_REPORTER: github
  CI_RUN_ID: ${{ github.run_id }}
  CI_RUN_ATTEMPT: ${{ github.run_attempt }}
  CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  CI_EVENT: ${{ github.ref_type == 'tag' && 'tag' || github.event_name == 'pull_request' && 'pr' || github.event_name == 'workflow_dispatch' && 'manual' || github.event_name }}
  CI_REF: ${{ github.ref }}
  CI_REF_NAME: ${{ github.ref_name }}
  CI_COMMIT: ${{ github.sha }}
  CI_WORKSPACE: ${{ github.workspace }}
  CI_REPOSITORY: ${{ github.repository }}

jobs:
  release-draft:
    name: publish (release-draft)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    # permissions: create the draft GitHub Release and upload its assets (ADR 0005 D6).
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - manifest_sha256: ${{ inputs.manifest_sha256 }}
            verified_manifest_sha256: ${{ inputs.verified_manifest_sha256 }}
            binary_cache: ${{ inputs.binary_cache }}
    env:
      CI_JOB: release-draft
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false

      # The package stage's `dist` by artifact ID (constraint 4), into
      # $CI_ARTIFACT_DIR/dist/.
      - name: Download dist
        id: download-dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          artifact-ids: ${{ inputs.dist_artifact_id }}
          path: ${{ runner.temp }}/artifacts/dist
          merge-multiple: true

      - name: Publish
        id: publish
        run: python3 scripts/ci/stage.py publish --destination github-release --only draft
        timeout-minutes: 8
        env:
          CI_TEMP_DIR: ${{ runner.temp }}
          CI_MANIFEST_SHA256: ${{ matrix.manifest_sha256 }}
          CI_VERIFIED_MANIFEST_SHA256: ${{ matrix.verified_manifest_sha256 }}
          CI_BUILD_BINARY_CACHE: ${{ matrix.binary_cache }}
          CI_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-promote:
    name: publish (release-promote)
    needs: release-draft
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    # permissions: promote the draft GitHub Release to published (ADR 0005 D6).
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - manifest_sha256: ${{ inputs.manifest_sha256 }}
            verified_manifest_sha256: ${{ inputs.verified_manifest_sha256 }}
            binary_cache: ${{ inputs.binary_cache }}
    env:
      CI_JOB: release-promote
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false

      - name: Download dist
        id: download-dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          artifact-ids: ${{ inputs.dist_artifact_id }}
          path: ${{ runner.temp }}/artifacts/dist
          merge-multiple: true

      # Re-reads the draft's exact asset set, sizes and downloaded digests
      # immediately before promoting it (RP-6); idempotent on a re-run.
      - name: Publish
        id: publish
        run: python3 scripts/ci/stage.py publish --destination github-release --only promote
        timeout-minutes: 8
        env:
          CI_TEMP_DIR: ${{ runner.temp }}
          CI_MANIFEST_SHA256: ${{ matrix.manifest_sha256 }}
          CI_VERIFIED_MANIFEST_SHA256: ${{ matrix.verified_manifest_sha256 }}
          CI_BUILD_BINARY_CACHE: ${{ matrix.binary_cache }}
          CI_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Constraint 11 / RP-7: sees what a consumer sees. contents: read, no
  # environment, no secret (policy P12 enforces all three for a post-publish
  # step), and stage.py refuses the phase if CI_PUBLISH_TOKEN is set at all.
  # The expected bytes are this run's dist/, anchored by manifest_sha256.
  post-publish:
    name: publish (post-publish)
    needs: release-promote
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - manifest_sha256: ${{ inputs.manifest_sha256 }}
            verified_manifest_sha256: ${{ inputs.verified_manifest_sha256 }}
            binary_cache: ${{ inputs.binary_cache }}
    env:
      CI_JOB: post-publish
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false

      - name: Download dist
        id: download-dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          artifact-ids: ${{ inputs.dist_artifact_id }}
          path: ${{ runner.temp }}/artifacts/dist
          merge-multiple: true

      - name: Post-publish check
        id: post-publish
        run: python3 scripts/ci/stage.py publish --destination github-release --only post-publish
        timeout-minutes: 6
        env:
          CI_TEMP_DIR: ${{ runner.temp }}
          CI_MANIFEST_SHA256: ${{ matrix.manifest_sha256 }}
          CI_VERIFIED_MANIFEST_SHA256: ${{ matrix.verified_manifest_sha256 }}
          CI_BUILD_BINARY_CACHE: ${{ matrix.binary_cache }}

  # Unprivileged (RP-2): no environment, no secret, contents: read. Everything
  # that executes third-party or toolchain code in the registry update runs
  # here and hands over files by artifact ID plus sha256 job outputs.
  registry-prepare:
    name: publish (registry-prepare)
    needs: release-promote
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && inputs.registry
    runs-on: ubuntu-24.04
    # Maintainer ruling 2026-11-18: cold-build steps get 45 minutes (measured cold
    # run: 34 min); job = 3 + 2 + 45 + 2. Exceeds C11's 30 (step_budgets.json).
    timeout-minutes: 52
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - manifest_sha256: ${{ inputs.manifest_sha256 }}
            verified_manifest_sha256: ${{ inputs.verified_manifest_sha256 }}
            binary_cache: ${{ inputs.binary_cache }}
    outputs:
      registry_prepared: ${{ steps.prepare.outputs.registry_prepared }}
      registry_artifact_id: ${{ steps.upload-registry.outputs.artifact-id }}
    env:
      CI_JOB: registry-prepare
    steps:
      # Full history: the base is a credential-less fetch of master, and the
      # registry lint run on the prepared change checks the append-only
      # history, REF ancestry and the v<version> tag (constraint 9).
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download dist
        id: download-dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          artifact-ids: ${{ inputs.dist_artifact_id }}
          path: ${{ runner.temp }}/artifacts/dist
          merge-multiple: true

      # Refuses if any credential is present (RP-2). Cold vcpkg build of the
      # port and its Boost dependencies (no cache in this file, P15): 45 minutes
      # by the maintainer's 2026-11-18 ruling (the one real cold run measured
      # 34; see step_budgets.json).
      - name: Prepare
        id: prepare
        run: python3 scripts/ci/stage.py publish --destination vcpkg-registry --only prepare
        timeout-minutes: 45
        env:
          CI_TEMP_DIR: ${{ runner.temp }}
          CI_MANIFEST_SHA256: ${{ matrix.manifest_sha256 }}
          CI_VERIFIED_MANIFEST_SHA256: ${{ matrix.verified_manifest_sha256 }}
          CI_BUILD_BINARY_CACHE: ${{ matrix.binary_cache }}

      # Exactly the three changed files, literal paths (P15).
      - name: Upload registry hand-off
        id: upload-registry
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 2
        with:
          name: registry
          path: |
            ${{ runner.temp }}/artifacts/registry/ports/smbios-c/portfile.cmake
            ${{ runner.temp }}/artifacts/registry/versions/baseline.json
            ${{ runner.temp }}/artifacts/registry/versions/s-/smbios-c.json
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 3

  registry-pr:
    name: publish (registry-pr)
    needs: registry-prepare
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && inputs.registry
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    # permissions: create the new branch registry/v<version> through the Git Data API (blobs, tree, commit, ref); never a PR, never master (threat model RP-9, constraint 10).
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - manifest_sha256: ${{ inputs.manifest_sha256 }}
            verified_manifest_sha256: ${{ inputs.verified_manifest_sha256 }}
            binary_cache: ${{ inputs.binary_cache }}
            prepared: ${{ needs.registry-prepare.outputs.registry_prepared }}
    env:
      CI_JOB: registry-pr
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false

      - name: Download dist
        id: download-dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          artifact-ids: ${{ inputs.dist_artifact_id }}
          path: ${{ runner.temp }}/artifacts/dist
          merge-multiple: true

      # The hand-over, by the registry-prepare job's artifact ID; each file is
      # checked against that job's sha256 outputs before it is parsed.
      - name: Download registry hand-off
        id: download-registry
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          artifact-ids: ${{ needs.registry-prepare.outputs.registry_artifact_id }}
          path: ${{ runner.temp }}/artifacts/registry
          merge-multiple: true

      # REST only: no git, vcpkg or compiler in this job (constraint 1).
      - name: Publish
        id: publish
        run: python3 scripts/ci/stage.py publish --destination vcpkg-registry --only branch
        timeout-minutes: 8
        env:
          CI_TEMP_DIR: ${{ runner.temp }}
          CI_MANIFEST_SHA256: ${{ matrix.manifest_sha256 }}
          CI_VERIFIED_MANIFEST_SHA256: ${{ matrix.verified_manifest_sha256 }}
          CI_BUILD_BINARY_CACHE: ${{ matrix.binary_cache }}
          CI_REGISTRY_PREPARED: ${{ matrix.prepared }}
          CI_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ADR 0005 D9 (Task 05): the release-tier repo-write class matrix. Same
  # constraints as release-draft (one publish step, the token only in its
  # env:, dist by artifact ID); stage.py binds CI_DESTINATION to this job's
  # tier and class (publish_jobs.json) and refuses a phased destination.
  publish-release-repo-write:
    name: publish (${{ matrix.destination }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && inputs.publish_repo_write != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    # permissions: write the repository for a single-phase repo-write destination (ADR 0005 D9).
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        destination: ${{ fromJSON(inputs.publish_repo_write) }}
        include:
          - manifest_sha256: ${{ inputs.manifest_sha256 }}
            verified_manifest_sha256: ${{ inputs.verified_manifest_sha256 }}
            binary_cache: ${{ inputs.binary_cache }}
    env:
      CI_JOB: publish-release-repo-write
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false

      - name: Download dist
        id: download-dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          artifact-ids: ${{ inputs.dist_artifact_id }}
          path: ${{ runner.temp }}/artifacts/dist
          merge-multiple: true

      - name: Publish
        id: publish
        run: python3 scripts/ci/stage.py publish
        timeout-minutes: 8
        env:
          CI_TEMP_DIR: ${{ runner.temp }}
          CI_DESTINATION: ${{ matrix.destination }}
          CI_MANIFEST_SHA256: ${{ matrix.manifest_sha256 }}
          CI_VERIFIED_MANIFEST_SHA256: ${{ matrix.verified_manifest_sha256 }}
          CI_BUILD_BINARY_CACHE: ${{ matrix.binary_cache }}
          CI_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ADR 0005 D9 (Task 05): the staging-tier oidc class matrix (s3-staging).
  # Push to master only, never a PR, fork, tag, nightly or dispatch (P8/P12
  # tier clause); after the same run's verify (CI_VERIFIED_MANIFEST_SHA256,
  # checked by stage.py). id-token: write lets stage.py request the OIDC token
  # (audience sts.amazonaws.com); the destination writes it to a 0600 file and
  # passes only AWS_WEB_IDENTITY_TOKEN_FILE and AWS_ROLE_ARN to the pinned aws
  # CLI. The bucket, prefix, role and region are secrets of the staging
  # environment, mapped only here. Create-only writes under staging/<version>/
  # <run-id>-<attempt>/, never a delete; the cloud-side role policy (S-9) is
  # the boundary, not this file.
  publish-staging-oidc:
    name: publish (${{ matrix.destination }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && inputs.publish_oidc != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    # permissions: request the OIDC token the staging destination exchanges for its role (ADR 0005 D9).
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        destination: ${{ fromJSON(inputs.publish_oidc) }}
        include:
          - manifest_sha256: ${{ inputs.manifest_sha256 }}
            verified_manifest_sha256: ${{ inputs.verified_manifest_sha256 }}
            binary_cache: ${{ inputs.binary_cache }}
    env:
      CI_JOB: publish-staging-oidc
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false

      - name: Download dist
        id: download-dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 2
        with:
          artifact-ids: ${{ inputs.dist_artifact_id }}
          path: ${{ runner.temp }}/artifacts/dist
          merge-multiple: true

      - name: Publish
        id: publish
        run: python3 scripts/ci/stage.py publish
        timeout-minutes: 8
        env:
          CI_TEMP_DIR: ${{ runner.temp }}
          CI_DESTINATION: ${{ matrix.destination }}
          CI_MANIFEST_SHA256: ${{ matrix.manifest_sha256 }}
          CI_VERIFIED_MANIFEST_SHA256: ${{ matrix.verified_manifest_sha256 }}
          CI_BUILD_BINARY_CACHE: ${{ matrix.binary_cache }}
          CI_PUBLISH_S3_BUCKET: ${{ secrets.CI_PUBLISH_S3_BUCKET }}
          CI_PUBLISH_S3_PREFIX: ${{ secrets.CI_PUBLISH_S3_PREFIX }}
          CI_PUBLISH_S3_ROLE: ${{ secrets.CI_PUBLISH_S3_ROLE }}
          CI_PUBLISH_S3_REGION: ${{ secrets.CI_PUBLISH_S3_REGION }}
